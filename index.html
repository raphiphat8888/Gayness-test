<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ: คุณเป็นเกย์ระดับไหน?</title>
    <meta name="description" content="ทำแบบทดสอบ 10 ข้อเพื่อค้นหาว่าคุณซ่อนความเป็นตัวแม่ไว้ระดับไหน!">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
